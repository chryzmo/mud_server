# A tiny sample world for development, the tests and CI. The real world lives in the
# private mud_content repository; this one mirrors the three rooms of the SQL seed.
# Check a directory with:  mud_server -validate-world world-sample
start_room: start-room

rooms:
  start-room:
    name: Start Room
    description: You find yourself in a generic looking room.  There is a door to the North.
    exits: {N: balcony}
    items: {key: 1}
    # Ambient lines reach a room only while players are in it. day_notes (a line per time of day that LOOK adds) work the same way.
    ambient:
      - {every: [600, 900], lines: ["Dust turns slowly in a shaft of light.", "Somewhere a door creaks."]}
    features:
      sign:
        names: [wooden sign, sign, notice]
        examine: "A hand-painted sign nailed beside the door: WELCOME. EXAMINE things to learn more about them."
    people:
      gatewarden:
        names: [Gatewarden, gargoyle, warden]
        examine: "A stone gargoyle with a surprisingly kind face, perched above the door."
        greeting: "\"Welcome, welcome!\" the Gatewarden rumbles. \"Mind the step, and do look around.\""
        shrug: "The Gatewarden shrugs, which sounds like gravel."
        topics:
          moving:
            keywords: [moving, directions, compass]
            say: "\"Use the buttons, or type MOVE and a direction. North, south, east, west, up or down.\""
          looking:
            keywords: [looking, examine]
            say: "\"EXAMINE anything that catches your eye. Signs, railings, even me.\""

  balcony:
    name: Balcony
    description: You are at a balcony overlooking the woods.  There is a door to the East and to the South.
    exits: {S: start-room, E: arena}
    features:
      railing:
        names: [stone railing, railing, balustrade]
        examine: "The stone is cool and worn smooth by a great many elbows."

  arena:
    name: Arena
    description: You are in the arena.  There is a door to the West.
    exits: {W: balcony}
    features:
      sand:
        names: [arena sand, sand]
        unlisted: true
        examine: "The sand is raked into a pattern that almost looks like a map."
    spawners:
      - {npc: orc, count: 1, tick_ms: 5000}

areas:
  start:
    rooms: [start-room, balcony, arena]

items:
  key:
    name: KEY
    description: A generic looking key.
  gold:
    name: GOLD
    description: Gold coin used for currency.
  iron-sword:
    name: IRON SWORD
    description: A plain but sturdy iron sword.
    equipment: {slot: weapon, attack: 5}
  wooden-shield:
    name: WOODEN SHIELD
    description: A round shield of banded wood.
    equipment: {slot: shield, defense: 4}
  leather-cap:
    name: LEATHER CAP
    description: A snug leather cap.
    equipment: {slot: helmet, defense: 2}
  leather-armor:
    name: LEATHER ARMOR
    description: A jerkin of boiled leather.
    equipment: {slot: chest, defense: 5, max_hp: 5}
  leather-leggings:
    name: LEATHER LEGGINGS
    description: Supple leather leggings.
    equipment: {slot: legs, defense: 3}
  leather-gloves:
    name: LEATHER GLOVES
    description: Worn leather gloves.
    equipment: {slot: hands, attack: 2, defense: 1}
  copper-ring:
    name: COPPER RING
    description: A thin copper band that hums faintly.
    equipment: {slot: ring, max_mp: 5}
  silver-pendant:
    name: SILVER PENDANT
    description: A small silver pendant on a chain.
    equipment: {slot: neck, defense: 1, max_hp: 2}

npcs:
  orc:
    race: ORC
    hp: 5
    mp: 1
    attack: 0
    accuracy: 0
    defense: 0
    combat_tick_ms: 5000
    behavior: orc
    loot_gold_min: 0
    loot_gold_max: 5

# Sticker codes hold only the HMAC of a code. This hash belongs to a code nobody was given, so the sample
# shows the format without a working sticker. Real hashes live in the private content repository.
codes:
  sample-sticker:
    hash: d7053fad68e3b8bc0316ef2a3cfe9df55b668d1b7c889c1a154efc47f6ca9d45
    color: gold
    badge: star
    message: "A warm light finds you."

# XP and levels. Anything left out takes the default; with no block the defaults apply.
progression:
  levels: [0, 25, 60, 110, 180, 270, 380, 520, 700, 900]
  per_level: {max_hp: 2, attack: 1, defense: 1}
  xp: {room: 10, feature: 5, kill: 5}

# The guided first steps for new players. Every line is optional; "onboarding: {}" uses plain defaults.
onboarding:
  welcome: "The keeper of the gate nods. \"Welcome, traveller. Let me show you around.\""
  steps:
    look: "\"First, LOOK. It tells you where you stand and which ways lead on.\""
    move: "\"Now choose an exit and walk it. Try MOVE with a direction, or tap one.\""
    examine: "\"Look closer at anything that catches your eye: EXAMINE and its name.\""
    talk: "\"Folk here will talk if you do. Try TALK.\""
    say: "\"And to speak to the whole room, SAY followed by your words.\""
  finish: "\"You have the way of it. HELP lists everything, WHO shows who is near, and REPORT tells the staff of any trouble.\""
